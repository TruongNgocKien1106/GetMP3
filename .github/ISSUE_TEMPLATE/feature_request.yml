name: Feature request
description: Suggest an improvement to GetMP3.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before describing the implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected user flow.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Download
        - Waiting list
        - YouTube search
        - Tag editor
        - Settings
        - Storage
        - Accessibility
        - Build and release
        - Other
    validations:
      required: true

  - type: checkboxes
    id: responsible_use
    attributes:
      label: Responsible use
      options:
        - label: This request does not bypass DRM, authentication, paywalls, or access controls.
          required: true